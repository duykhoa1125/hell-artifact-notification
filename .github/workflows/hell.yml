name: Hell Artifact Notification

on:
  schedule:
    # UTC; intentionally off the beginning of each hour.
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test sends a sample image; Live checks current LMEvents'
        required: true
        default: test
        type: choice
        options:
          - test
          - live

permissions:
  contents: read

concurrency:
  group: hell-artifact
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: TEST - recognize sample and send private test message
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py test-notify --file tests/hell_sample_1.png
      - name: Check only the newest active Hell
        if: github.event_name == 'schedule' || inputs.mode == 'live'
        id: latest
        run: python bot.py inspect
      - name: Restore dedupe marker
        if: steps.latest.outputs.post_id != ''
        id: dedupe
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .state
          key: hell-artifact-${{ steps.latest.outputs.post_id }}
      - name: Match Artifact icon and notify privately
        if: steps.latest.outputs.post_id != '' && steps.dedupe.outputs.cache-hit != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py notify --file latest.json
          mkdir -p .state
          printf '%s\n' '${{ steps.latest.outputs.post_id }}' > .state/last-id
